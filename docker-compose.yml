version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: exam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ExamApp@2026
      MYSQL_DATABASE: school_exam_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    image: dean221/exam-backend:1.0
    container_name: exam-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/school_exam_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ExamApp@2026
      JWT_SECRET: "day-la-chuoi-jwt-secret-dai-64-ky-tu-thay-doi-truoc-khi-deploy-abc123"
      JWT_EXPIRATION_MS: 3600000
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
