spring:
  application:
    name: exam-app-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/school_exam_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-env-variable-come-my-way-pleaseifyouhavetodosuremy-cow-rabbit-is-safe}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
