spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false

jwt:
  secret: "test-secret-key-change-me-and-make-it-long-enough-for-hs256-signing"
  expiration-ms: 3600000

app:
  security:
    encryption:
      exam-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    rate-limit:
      login-per-minute: 5000
